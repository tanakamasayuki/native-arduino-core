name: Native tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 10:00 JST (01:00 UTC).
    - cron: '0 1 * * 1'

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # g++ is preinstalled on ubuntu-latest. The runtime tests use the
      # default FQBN (sdl2=disabled), so no SDL2 / display is required.

      # Windows: platform.txt calls a bare `g++` from PATH. Provide it via
      # MSYS2/UCRT64 (preinstalled at C:\msys64 on the runner). Adding
      # ucrt64/bin to PATH also lets the produced .out find its runtime DLLs.
      - name: Install g++ (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc

      - name: Add UCRT64 toolchain to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Show arduino-cli version
        run: arduino-cli version

      - name: Initialize arduino-cli sketchbook
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      # conftest.py registers this repo into the arduino-cli sketchbook
      # (hardware/lang-ship/native) automatically, so no separate install
      # step is needed.
      - name: Run pytest
        working-directory: tests
        run: uv run pytest -v
